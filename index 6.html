<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wassel WebAR Test</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
<style>
html,body{margin:0;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
#ui{position:fixed;z-index:10;inset:0;pointer-events:none}
.panel{position:absolute;left:14px;right:14px;top:14px;background:#000b;color:#fff;border-radius:16px;padding:12px;text-align:center}
button{pointer-events:auto;border:0;border-radius:12px;padding:11px 16px;margin-top:8px;font-weight:700}
#status{font-size:13px;margin-top:7px;opacity:.9}
</style>
</head>
<body>
<div id="ui"><div class="panel">
<b>Wassel — WebAR حقيقي (GPS)</b><br>
وجه الكاميرا للأمام. ستظهر نقاط ثلاثية الأبعاد مرتبطة بموقعك.<br>
<button id="start">تشغيل AR</button>
<div id="status">لم يبدأ بعد</div>
</div></div>

<a-scene id="scene" vr-mode-ui="enabled:false"
  renderer="antialias:true; alpha:true"
  embedded
  arjs="sourceType:webcam; videoTexture:true; debugUIEnabled:false">
  <a-camera id="cam"
    gps-new-camera="gpsMinDistance:1"
    look-controls-enabled="false"
    arjs-device-orientation-controls="smoothingFactor:0.08">
  </a-camera>
</a-scene>

<script>
const scene=document.getElementById('scene');
const status=document.getElementById('status');
const start=document.getElementById('start');

function addMarker(lat,lon,label,color){
 const e=document.createElement('a-entity');
 e.setAttribute('gps-new-entity-place',`latitude: ${lat}; longitude: ${lon}`);
 e.setAttribute('position','0 1.2 0');
 e.setAttribute('look-at','#cam');
 const ring=document.createElement('a-ring');
 ring.setAttribute('radius-inner','.45'); ring.setAttribute('radius-outer','.58');
 ring.setAttribute('color',color); ring.setAttribute('rotation','-90 0 0');
 e.appendChild(ring);
 const text=document.createElement('a-text');
 text.setAttribute('value',label); text.setAttribute('align','center');
 text.setAttribute('color',color); text.setAttribute('scale','4 4 4');
 text.setAttribute('position','0 .9 0');
 e.appendChild(text);
 scene.appendChild(e);
}

start.onclick=()=>{
 start.disabled=true;
 status.textContent='جاري طلب الموقع والكاميرا...';
 navigator.geolocation.getCurrentPosition(pos=>{
   const lat=pos.coords.latitude, lon=pos.coords.longitude;
   status.textContent='تم تحديد موقعك. حرّك الجوال ببطء وابحث عن النقاط.';
   const d=.00012; // ~13m
   addMarker(lat+d,lon,'نقطة 1','#20e66b');
   addMarker(lat+d*0.5,lon+d*0.7,'نقطة 2','#20e66b');
   addMarker(lat,lon+d,'🎯 الباب','#ffd43b');
 },err=>{
   status.textContent='تعذر تحديد الموقع: '+err.message;
   start.disabled=false;
 },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
};
</script>
</body>
</html>
