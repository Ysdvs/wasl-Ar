<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Wassel AR — Camera Prototype</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
#ui{position:fixed;inset:0;pointer-events:none}
.panel{position:absolute;left:16px;right:16px;background:#000b;color:#fff;border-radius:16px;padding:12px 14px;text-align:center}
.top{top:18px;font-size:15px}
.bottom{bottom:20px;font-size:14px}
button{pointer-events:auto;border:0;border-radius:12px;padding:12px 20px;font-size:16px;font-weight:700;margin-top:8px}
.path{position:absolute;left:50%;bottom:25%;width:130px;height:48%;transform:translateX(-50%);pointer-events:none}
.dot{position:absolute;left:50%;width:18px;height:18px;border-radius:50%;background:#2ee875;box-shadow:0 0 20px #2ee875;transform:translateX(-50%)}
.d1{bottom:2%}.d2{bottom:15%}.d3{bottom:30%}.d4{bottom:47%}.d5{bottom:65%}
.target{position:absolute;left:50%;top:3%;transform:translateX(-50%);font-size:42px;text-shadow:0 2px 8px #000}
.hidden{display:none}
</style>
</head>
<body>
<video id="camera" autoplay playsinline muted></video>
<div id="ui">
  <div class="panel top">Wassel — تجربة مسار الوصول</div>
  <div class="path">
    <span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span>
    <span class="dot d4"></span><span class="dot d5"></span>
    <span class="target">🎯</span>
  </div>
  <div class="panel bottom" id="message">
    اضغط لتشغيل الكاميرا
    <br><button id="start">تشغيل الكاميرا</button>
  </div>
</div>
<script>
const video=document.getElementById('camera');
const msg=document.getElementById('message');
document.getElementById('start').addEventListener('click',async()=>{
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'}},
      audio:false
    });
    video.srcObject=stream;
    msg.innerHTML='وجّه الكاميرا للأمام وشاهد شكل المسار 🟢 → 🎯';
  }catch(err){
    msg.innerHTML='لم يتم السماح بالكاميرا. افتح الرابط عبر HTTPS واسمح للمتصفح بالكاميرا.';
  }
});
</script>
</body>
</html>
